name: Build LocalShop Role APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build all role APKs
        run: gradle :app:assembleAdminDebug :app:assembleFounderDebug :app:assembleSuperfounderDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-mart-admin-apk
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-mart-founder-apk
          path: app/build/outputs/apk/founder/debug/app-founder-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: localshop-superfounder-apk
          path: app/build/outputs/apk/superfounder/debug/app-superfounder-debug.apk
          if-no-files-found: error
